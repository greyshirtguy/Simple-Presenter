# For tests only: a sink that plays to nowhere, so that what an app plays can be recorded back and measured
# without a sound card being touched or anything being heard.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "test-sink"
            node.description = "Test sink"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            monitor.channel-volumes = true
            monitor.passthrough = true
        }
    }
]
