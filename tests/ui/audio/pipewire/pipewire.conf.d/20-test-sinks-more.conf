# For tests only, beside the test sink: two that play to nowhere with more channels, as the
# outputs of an interface for sound can be, for routing the app's channels to a device's to be
# recorded back and measured. One names its channels as a surround set does (5.1), the other
# numbers them, as an interface for a mixing desk does (eight, AUX0 to AUX7). Lower in priority
# than the test sink, which stays the one sound goes to where nothing else is chosen.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "test-sink-6"
            node.description = "Test sink, six channels"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR,FC,LFE,RL,RR"
            priority.session = 100
            monitor.channel-volumes = true
            monitor.passthrough = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "test-sink-8"
            node.description = "Test sink, eight channels"
            media.class      = "Audio/Sink"
            audio.position   = "AUX0,AUX1,AUX2,AUX3,AUX4,AUX5,AUX6,AUX7"
            priority.session = 100
            monitor.channel-volumes = true
            monitor.passthrough = true
        }
    }
]
