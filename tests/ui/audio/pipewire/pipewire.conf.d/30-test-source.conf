# For tests only: a sound input that hears whatever is played into it, and nothing else,
# so that sound made for a test (timecode, for the timecode's: see `play` in run.py's
# test()) can be given to the app as if it came down a cable, without a sound card being
# touched. Two channels.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "test-source"
            node.description = "Test source"
            media.class      = "Audio/Source/Virtual"
            audio.position   = "FL,FR"
        }
    }
]
